name: ineed_app
description: "iNeed - Marketplace de serviços sob demanda"
publish_to: 'none'
version: 0.5.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.0
  mask_text_input_formatter: ^2.9.0
  url_launcher: ^6.3.0
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icone_app.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#00288E"
  image: assets/images/icone_splash.png
  android_12:
    color: "#00288E"
    image: assets/images/icone_splash.png
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/
